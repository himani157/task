name: Backend Continuous Integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/starter/backend/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install pipenv
        run: |
          cd starter/backend
          pip install pipenv
      
      - name: Install dependencies
        run: |
          cd starter/backend
          pipenv install --dev
      
      - name: Run lint
        run: |
          cd starter/backend
          pipenv run flake8

  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/starter/backend/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install pipenv
        run: |
          cd starter/backend
          pip install pipenv
      
      - name: Install dependencies
        run: |
          cd starter/backend
          pipenv install --dev
      
      - name: Run tests
        run: |
          cd starter/backend
          pipenv run pytest

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Build Docker image
        run: |
          cd starter/backend
          docker build -t backend-app .